        custom_model_data: 95
      toughness:
        group: second_row
        order: 3
        material: paper
        custom_model_data: 96
      crit_chance:
        group: third_row
        order: 1
        material: paper
        custom_model_data: 97
      crit_damage:
        group: third_row
        order: 2
        material: paper
        custom_model_data: 98
