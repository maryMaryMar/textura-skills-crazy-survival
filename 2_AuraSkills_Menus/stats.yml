    - '<gray>ᴇᴀʀɴ ꜱᴛᴀᴛꜱ ʙᴜꜰꜰ ʙʏ'
    - '<gray>ʟᴇᴠᴇʟɪɴɢ ᴜᴘ ꜱᴋɪʟʟꜱ'
