    - '<gray>ᴜᴘɢʀᴀᴅᴇ ʏᴏᴜʀ ꜱᴋɪʟʟꜱ ʙʏ ᴅᴏɪɴɢ'
    - '<gray>ᴠᴀʀɪᴏᴜꜱ ᴛᴀꜱᴋꜱ ᴛᴏ ʙᴇᴄᴏᴍᴇ ᴘᴏᴡᴇʀꜰᴜʟ'
    - '<gray>ᴡɪᴛʜ ᴜɴʟᴏᴄᴋᴇᴅ ꜱᴛᴀᴛ ʙᴏᴏꜱᴛꜱ,'
    - '<gray>ᴀʙɪʟɪᴛɪᴇꜱ ᴀɴᴅ ᴍᴏʀᴇ!'
