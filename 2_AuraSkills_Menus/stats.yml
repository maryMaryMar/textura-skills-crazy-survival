    pos: 2,2
    material: player_head
    custom_model_data: 4
    display_name: '<bold><#d4a177>{player}'
    lore:
      - '{entries[\n]}'
  back:
    material: paper
    custom_model_data: 90
    pos: 1,0
    display_name: '<#d4a177>Back'
  stats:
    pos: 3,1
    material: paper
    custom_model_data: 76
    display_name: '<bold><#d4a177>ꜱᴛᴀᴛꜱ'
