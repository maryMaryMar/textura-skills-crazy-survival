title: '&f七七七七七七七七'
size: 5
fill:
  enabled: false
  material: black_stained_glass_pane
items:
  leaderboard:
    pos: 1,8
    material: paper
    custom_model_data: 103
    display_name: '<#d4a177>Leaderboards'
    lore:
    - '<gray>Level up your skills to'
    - '<gray>show up in leaderboard'
    on_click:
      - type: command
        executor: console
        command: dm open skills_leaderboards {player}
  back:
    pos: 1,0
    material: paper
    custom_model_data: 102
    display_name: '<#d4a177>Back'
  previous_page:
    pos: 4,1
    material: paper
    custom_model_data: 109
    display_name: '<#d4a177>Previous Page'
  next_page:
    pos: 4,7
    material: paper
    custom_model_data: 110
    display_name: '<#d4a177>Next Page'
  sources:
    pos: 2,8
    material: paper
    custom_model_data: 104
    display_name: '<#d4a177>XP Sources'
    lore:
    - '<gray>Sources menu shows all'
    - '<gray>the ways you can earn'
    - '<gray>XP in a skill'
  abilities:
    pos: 3,8
    material: paper
    custom_model_data: 105
    display_name: '<#d4a177>Abilities'
    lore:
    - '<gray>Abilities are passive perks you unlock'
    - '<gray>and upgrade as you level up skills. Mana'
    - '<gray>abilities are special type of ability'
    - '<gray>that requires activation and'
    - '<gray>consumes mana'
  job:
    pos: 0,4
    material: gold_ingot
    display_name: '<yellow>{{job}}'
    lore:
    - text: '{{job_desc}}'
      wrap: true
      style: '<gray>'
    - ' '
    - component: job_select
    - component: job_active
    - component: job_limit
    - component: job_cooldown
templates:
  unlocked:
    material: paper
    custom_model_data: 106
    display_name: '<bold><#88d34c>Level {level}'
    lore:
    - component: rewards
    - component: ability_unlock
    - component: ability_level
    - component: mana_ability_unlock
    - component: mana_ability_level
    - ' '
    - '<#88d34c>ᴜɴʟᴏᴄᴋᴇᴅ'
  in_progress:
    material: paper
    custom_model_data: 107
    display_name: '<bold><#f1d566>{{level}} {level}'
    lore:
    - component: rewards
    - component: ability_unlock
    - component: ability_level
    - component: mana_ability_unlock
    - component: mana_ability_level
    - ' '
    - '<dark_gray>▪ <gray>ᴘʀᴏɢʀᴇꜱꜱ:'
    - '  {bar}'
    - '  <#76b742>{current_xp}<dark_gray>/{level_xp} {xp_unit} {percent}%'
    - ' '
    - '<#f1d566>ɪɴ ᴘʀᴏɢʀᴇꜱꜱ'
  locked:
    material: paper
    custom_model_data: 108
    display_name: '<bold><#e5534d>{{level}} {level}'
    lore:
    - component: rewards
    - component: ability_unlock
    - component: ability_level
    - component: mana_ability_unlock
    - component: mana_ability_level
    - ' '
    - '<#e5534d>ʟᴏᴄᴋᴇᴅ'
components:
  stats_leveled:
    context: Skill
    lore:
    - ' '
    - '<gray>{{stats_leveled}}: {entries[<gray>, ]}'
  ability_levels:
    context: Skill
    lore:
    - ' '
    - '<gray>{{ability_levels}}: {entries[]}'
  mana_ability_info:
    context: Skill
    lore:
    - ' '
    - '<light_purple><bold>{{mana_ability}}</bold> <blue>{name} {level}'
    - '  {entries[\n  ](3)}'
  progress:
    context: Skill
    lore:
    - '<gray>{{progress_to_level}} {next_level}: <yellow>{percent}%'
    - '{bar}'
    - '<gray>{current_xp}/{level_xp} {xp_unit}'
  max_level:
    context: Skill
    lore:
    - '<gold>{{max_level}}'
  rewards:
    context: Integer
    lore:
    - '<dark_gray>▪ <gray>ʀᴇᴡᴀʀᴅꜱ: {entries[]}'
  ability_unlock:
    context: Integer
    lore:
    - ' '
    - '<dark_gray>▪ <gray>ᴀʙɪʟɪᴛʏ ᴜɴʟᴏᴄᴋ:'
    - '  <bold><#88d34c>✔</bold> <white>{name}'
    - text: '{desc}'
      wrap: true
      wrap_indent: '  '
      style: '<#8b8b8b>'
  ability_level:
    context: Integer
    lore:
    - ' '
    - '<dark_gray>▪ <gray>ᴀʙɪʟɪᴛʏ ʟᴇᴠᴇʟ:'
    - '  <bold><#88d34c>✔</bold> <white>{name} <gray>{level}'
    - text: '{desc}'
      wrap: true
      wrap_indent: '  '
      style: '<#8b8b8b>'
  mana_ability_unlock:
    context: Integer
    lore:
    - ' '
    - '<dark_gray>▪ <gray>ᴍᴀɴᴀ ᴀʙɪʟɪᴛʏ ᴜɴʟᴏᴄᴋ:'
    - '  <bold><#88d34c>✔</bold> <white>{name}'
    - text: '{desc}'
      wrap: true
      wrap_indent: '  '
      styles:
        0: '<#8b8b8b>'
        1: '<#8b8b8b>'
  mana_ability_level:
    context: Integer
    lore:
    - ' '
    - '<dark_gray>▪ <gray>ᴍᴀɴᴀ ᴀʙɪʟɪᴛʏ ʟᴇᴠᴇʟ:'
    - '  <bold><#88d34c>✔</bold> <white>{name} <gray>{level}'
    - text: '{desc}'
      wrap: true
      wrap_indent: '  '
      styles:
        0: '<#8b8b8b>'
        1: '<#8b8b8b>'
  job_select:
    lore:
    - '<yellow>{{job_select}}'
  job_active:
    lore:
    - '<dark_gray>▶ <green>{{job_active}}'
    - ' '
    - '<gray>{{job_quit}}'
  job_limit:
    lore:
    - text: '{{job_limit}}'
      wrap: true
      style: '<red>'
  job_cooldown:
    lore:
    - text: '{{job_cooldown}}'
      wrap: true
      style: '<red>'
formats:
  stat_leveled_entry: '{color}{stat}<gray>'
  unlocked_ability_entry: '\n  <gold>{name} {level} <dark_gray>({info})'
  locked_ability_entry: '\n  <dark_gray><strikethrough>{name}'
  duration_entry: '<gray>{{duration}}: <green>{duration}s '
  mana_cost_entry: '<gray>{{mana_cost}}: <aqua>{mana_cost} '
  cooldown_entry: '<gray>{{cooldown}}: <yellow>{cooldown}s '
  damage_entry: '<gray>{{damage}}: <red>{value} '
  damage_per_mana_entry: '<gray>{{damage}}: <red>+{value}% / Mana '
  max_mana_cost_entry: '<gray>{{max_mana_cost}}: <aqua>{mana_cost} '
  attack_speed_entry: '<gray>{{attack_speed}}: <red>+{value}% '
  stat_reward_entry: '\n  {color}+{num} {symbol} {stat}'
  money_reward_entry: '\n  <green>${amount}'
options:
  use_level_as_amount: false
  over_max_stack_amount: 1
  items_per_page: 14
  start_level: 1
  track: [10, 19, 28, 29, 30, 21, 12, 14, 23, 32, 33, 34, 25, 16]
file_version: 2
