    lore:
      - '<dark_gray>▪ <gray>ʏᴏᴜʀ ʟᴇᴠᴇʟ: <#aaede6>{level} (MAXED)'
  unlocked_desc:
    context: AbstractAbility
    lore:
      - text: '<dark_gray>▪ <gray>ɴᴇxᴛ ᴜᴘɢʀᴀᴅᴇ ᴀᴛ: <#aaede6>{{next_upgrade_at}}'
      - text: '{desc}'
        wrap: true
        wrap_indent: '  '
        styles:
          0: '<#8b8b8b>'
  unlocked_desc_maxed:
    context: AbstractAbility
    lore:
      - text: '{desc}'
        wrap: true
        styles:
          0: '<gray>'
formats:
  desc_upgrade_value: '<gray>{current}<dark_gray>→{next}<gray>'